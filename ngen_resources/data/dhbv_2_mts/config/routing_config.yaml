#-------------------------------------------------------------------------------
log_parameters:
  #----------
  showtiming: True
  log_level : DEBUG

#-------------------------------------------------------------------------------
network_topology_parameters:
  #----------
  supernetwork_parameters:
    #----------
    network_type: HYFeaturesNetwork
    geo_file_path: ./data/geo/camels_subset_hf2_2.gpkg

    columns:
      key: 'id'
      downstream: 'toid'
      dx : 'Length_m'
      n : 'n'
      ncc : 'nCC'
      s0 : 'So'
      bw : 'BtmWdth'
      waterbody : 'WaterbodyID'
      gages : 'gage'
      tw : 'TopWdth'
      twcc : 'TopWdthCC'
      musk : 'MusK'
      musx : 'MusX'
      cs : 'ChSlp'
      alt: 'alt'

  waterbody_parameters:
      #----------
      break_network_at_waterbodies: False

#-------------------------------------------------------------------------------
compute_parameters:
  #----------
  parallel_compute_method: by-subnetwork-jit-clustered # serial
  compute_kernel: V02-structured
  assume_short_ts: True
  subnetwork_target_size: 10000
  cpu_pool: 8  # raise to match your core count for larger networks

  restart_parameters:
    #----------
    # Routing begins where the model starts producing flow, not where ngen
    # starts: the first 8760 hours of a dHBV2.0 MTS run are spin-up and emit
    # zero runoff. Routing them wastes time and dilutes any check on the
    # result. 2008-01-09 00:00 + 8760 h = 2009-01-08 00:00.
    start_datetime: 2009-01-08 00:00:00
  forcing_parameters:
    #----------
    # Ngen's timestep divided by t-route's (e.g. 3600/300)
    qts_subdivisions: 12
    # T-route's internal timestep in seconds
    dt: 300 # [sec]
    # Total t-route timesteps = routed hours x qts_subdivisions.
    # Here the full post-spin-up period: (26088 - 8760) x 12 = 207936.
    nts: 207936.0
    # Number of external (ngen) timesteps (NOTE: must change if time period changes)
    max_loop_size: 26088.0 # [hr]
    # The location to find the nex-* CSV files
    qlat_input_folder: ./output/
    nexus_input_folder: ./output/
    # The glob pattern to match nexus output files - MUST NOT CHANGE!
    qlat_file_pattern_filter: 'nex-*'
    nexus_file_pattern_filter: 'nex-*'
    # A directory where the temporary *.parquet files will be stored
    # binary_nexus_file_folder: ./output/troute_tmp/

  data_assimilation_parameters:
    #----------
    # usgs_timeslices_folder   : ./usgs_TimeSlice/
    # usace_timeslices_folder  : #usace_TimeSlice/
    # timeslice_lookback_hours : #48
    # qc_threshold             : #1

    streamflow_da:
      #----------
      streamflow_nudging: False
      diffusive_streamflow_nudging: False

    reservoir_da:
      #----------
      reservoir_persistence_da:
        #----------
        reservoir_persistence_usgs: False
        reservoir_persistence_usace: False
      reservoir_rfc_da:
        #----------
        reservoir_rfc_forecasts: False
#-------------------------------------------------------------------------------
output_parameters:
  #----------
  stream_output:
    stream_output_directory: ./output/stream_output/
    # Hours of routed flow per output file. -1 writes the whole run to a
    # single file -- with 17328 routed hours, the default of 1 would emit
    # 17328 NetCDFs.
    stream_output_time: -1
    stream_output_type: '.nc' #please select only between netcdf '.nc' or '.csv' or '.pkl'
    stream_output_internal_frequency: 60 #[min] it should be order of 5 minutes. For instance if you want to output every hour put 60
